<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
<defs>
 <radialGradient id="bg" cx="35%" cy="20%" r="90%"><stop offset="0" stop-color="#E2FBCE"/><stop offset=".45" stop-color="#076653"/><stop offset="1" stop-color="#06231D"/></radialGradient>
 <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34,37,46"/><stop offset="1" stop-color="#30,49,80"/></linearGradient>
